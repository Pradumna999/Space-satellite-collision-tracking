[project]
name = "astral"
version = "2.0.0"
description = "ASTRAL — Advanced Space Traffic Risk Assessment & Analysis Laboratory"
requires-python = ">=3.11,<3.13"
license = { text = "Apache-2.0" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: long-running benchmark or training tests"]
filterwarnings = ["ignore::erfa.ErfaWarning"]

[tool.ruff]
line-length = 200
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
# B008: FastAPI's Depends() idiom. B023: closures are invoked inside the loop
# iteration that defines them (reviewed). S105: settings default flagged by name only.
ignore = ["S101", "S311", "B008", "B023", "B905", "UP040", "UP042", "S105"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "E731"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = false
warn_unused_ignores = false
